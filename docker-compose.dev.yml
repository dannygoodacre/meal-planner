services:
  meal-planner-dev-db:
    image: postgres:16-alpine
    container_name: meal-planner-dev-db
    environment:
      POSTGRES_DB: meal-planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meal-planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - meal-planner-dev-db-data:/var/lib/postgresql/data

volumes:
  meal-planner-dev-db-data:
    name: meal-planner-dev-db-data
