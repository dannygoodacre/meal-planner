services:
  meal-planner:
    image: ghcr.io/dannygoodacre/meal-planner:${MEAL_PLANNER_VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${MEAL_PLANNER_VERSION:-0.0.0-dev}
    container_name: meal-planner
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=meal-planner-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      meal-planner-db:
        condition: service_healthy

  meal-planner-db:
    image: postgres:16-alpine
    container_name: meal-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - meal-planner-db-data:/var/lib/postgresql/data

volumes:
  meal-planner-db-data:
