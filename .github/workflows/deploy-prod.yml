name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, e.g. 0.2.0 (must already be published by the Release workflow)"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate version and branch
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy from main, not $GITHUB_REF."
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: tailscale ssh "deploy@$DEPLOY_HOST" deploy prod "$VERSION"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          VERSION: ${{ inputs.version }}
