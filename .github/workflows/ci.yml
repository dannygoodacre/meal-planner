name: CI

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Commit to test (defaults to the triggering commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.*
      - run: dotnet restore MealPlanner.slnx
      - run: dotnet ef migrations has-pending-model-changes -p src/MealPlanner.Data -s src/MealPlanner.Web
      - run: dotnet test --solution MealPlanner.slnx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier:check
      - run: npm test
      - run: npm run build
