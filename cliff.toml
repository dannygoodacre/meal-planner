[changelog]
header = """
# Changelog

"""
# The <!-- n --> prefixes order the groups; striptags removes them from the output.
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.breaking_description %}. {{ commit.breaking_description | replace(from="\n", to=" ") | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_commits = true
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Upgrade notes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^(docs|ci|chore|test|build|style|refactor)", skip = true },
]
